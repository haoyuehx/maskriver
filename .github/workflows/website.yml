name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test website
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npx playwright test
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-${{ github.run_id }}
          path: website/test-results/screens
          if-no-files-found: warn
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Post-deploy smoke test
        run: |
          base='https://haoyuehx.github.io/maskriver'
          for attempt in $(seq 1 12); do
            code=$(curl -sS -o /tmp/site.html -w '%{http_code}' --http1.1 "$base/") || true
            [ "$code" = "200" ] && break
            sleep 10
          done
          test "$code" = "200"
          grep -q 'MaskRiver' /tmp/site.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' --http1.1 -r 0-1023 "$base/media/maskriver-demo-v2.mp4")" = "206"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --http1.1 "$base/og-image.png")" = "200"
