name: Synthetic performance benchmarks

on:
  pull_request:
    paths:
      - "internal/runner/**"
      - "internal/mask/**"
      - "cmd/maskriver/**"
      - "scripts/bench_report.py"
      - "scripts/bench_system_report.py"
      - "scripts/db_bench_report.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Environment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-out
          {
            date --utc --iso-8601=seconds
            go version
            go env GOOS GOARCH GOAMD64
            uname -a
            nproc
            git rev-parse HEAD
            go list -m github.com/go-sql-driver/mysql modernc.org/sqlite
          } | tee bench-out/environment.txt
      - name: Repeat synthetic masking benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^$' -bench '^BenchmarkMaskBatchWorkers$' -benchmem -count=3 -benchtime=300ms ./internal/runner | tee bench-out/raw.txt
      - name: Generate machine-readable metrics and chart
        run: python3 scripts/bench_report.py bench-out/raw.txt bench-out
      - name: Race regression
        run: go test -race -count=1 ./internal/runner/... ./internal/mask/...
      - name: Fuzz worker ordering and encoding
        run: go test -run '^$' -fuzz '^FuzzMaskBatchDeterminism$' -fuzztime=10s -parallel=2 ./internal/runner
      - name: Fuzz synthetic CN checksum invariants
        shell: bash
        run: |
          set -euo pipefail
          for name in FuzzCNIDReplacement FuzzCNBankReplacement FuzzCNUSCCReplacement; do
            go test -run '^$' -fuzz "^${name}$" -fuzztime=5s -parallel=2 ./internal/mask
          done
      - name: Measure separate process CPU and peak RSS (synthetic transform only)
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 4 8; do
            /usr/bin/time -v -o "bench-out/process-workers-${n}.txt" go test -run '^$' -bench "^BenchmarkMaskBatchWorkers/workers_${n}$" -benchmem -benchtime=500ms -count=1 ./internal/runner > "bench-out/process-workers-${n}-raw.txt"
          done
          python3 scripts/bench_system_report.py bench-out
      - name: Measure real SQLite Preview/Apply/Validate at multiple scales
        shell: bash
        run: |
          set -euo pipefail
          # A compiled binary excludes Go build/compiler startup from /usr/bin/time.
          # SQLite fixture generation still contributes to process peak RSS and CPU.
          go test -c -o bench-out/sqlite-workflow.test ./cmd/maskriver
          /usr/bin/time -v -o bench-out/sqlite-process.txt \
            ./bench-out/sqlite-workflow.test \
            -test.run '^        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mask-benchmarks
          path: bench-out/
      - name: Caveats
        if: always()
        shell: bash
        run: |
          echo 'Synthetic in-memory measurements and real SQLite single-table Preview/Apply/Validate measurements are separate; benchmark-process CPU/RSS still include fixture setup. No MySQL CLI, production PII, latency SLA or linear speedup is claimed.' >> "$GITHUB_STEP_SUMMARY"
 -test.bench '^BenchmarkSQLiteM1Workflow        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mask-benchmarks
          path: bench-out/
      - name: Caveats
        if: always()
        shell: bash
        run: |
          echo 'Synthetic transform throughput only. Process RSS and CPU include Go test startup, not full database measurements. No linear speedup or privacy certification is claimed.' >> "$GITHUB_STEP_SUMMARY"
 \
            -test.benchtime=1x -test.count=3 -test.benchmem \
            | tee bench-out/sqlite-raw.txt
          python3 scripts/db_bench_report.py bench-out
      - name: Upload measured evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mask-benchmarks
          path: bench-out/
      - name: Caveats
        if: always()
        shell: bash
        run: |
          echo 'Synthetic transform throughput only. Process RSS and CPU include Go test startup, not full database measurements. No linear speedup or privacy certification is claimed.' >> "$GITHUB_STEP_SUMMARY"
