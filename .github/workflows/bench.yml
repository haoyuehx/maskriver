name: Synthetic performance benchmarks

on:
  pull_request:
    paths:
      - "internal/runner/**"
      - "internal/mask/**"
      - "cmd/maskriver/**"
      - "scripts/bench_report.py"
      - "scripts/bench_system_report.py"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Environment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench-out
          {
            date --utc --iso-8601=seconds
            go version
            go env GOOS GOARCH GOAMD64
            uname -a
            nproc
            git rev-parse HEAD
            go list -m github.com/go-sql-driver/mysql modernc.org/sqlite
          } | tee bench-out/environment.txt
      - name: Repeat synthetic masking benchmarks
        shell: bash
        run: |
          set -euo pipefail
          go test -run '^$' -bench '^(BenchmarkMaskBatchWorkers|BenchmarkWorkflow)$' -benchmem -count=3 -benchtime=300ms ./internal/runner | tee bench-out/raw.txt
      - name: Real SQLite workflow baseline (single iteration, artifacts uploaded)
        shell: bash
        run: |
          set -euo pipefail
          MASK_RIVER_PERF_DIR=bench-out/perf MASK_RIVER_PERF_ITERS=1 \
            go test -run 'TestPerfBaseline|TestPerfArtifactsMatchSamples' -count=1 -timeout 40m -v ./internal/runner
      - name: Generate machine-readable metrics and chart
        run: python3 scripts/bench_report.py bench-out/raw.txt bench-out
      - name: Race regression
        run: go test -race -count=1 ./internal/runner/... ./internal/mask/...
      - name: Fuzz worker ordering and encoding
        run: go test -run '^$' -fuzz '^FuzzMaskBatchDeterminism$' -fuzztime=10s -parallel=2 ./internal/runner
      - name: Fuzz synthetic CN checksum invariants
        shell: bash
        run: |
          set -euo pipefail
          for name in FuzzCNIDReplacement FuzzCNBankReplacement FuzzCNUSCCReplacement; do
            go test -run '^$' -fuzz "^${name}$" -fuzztime=5s -parallel=2 ./internal/mask
          done
      - name: Measure separate process CPU and peak RSS (synthetic transform only)
        shell: bash
        run: |
          set -euo pipefail
          for n in 1 2 4 8; do
            /usr/bin/time -v -o "bench-out/process-workers-${n}.txt" go test -run '^$' -bench "^BenchmarkMaskBatchWorkers/workers_${n}$" -benchmem -benchtime=500ms -count=1 ./internal/runner > "bench-out/process-workers-${n}-raw.txt"
          done
          python3 scripts/bench_system_report.py bench-out
      - name: Upload measured evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-mask-benchmarks
          path: bench-out/
      - name: Caveats
        if: always()
        shell: bash
        run: |
          echo 'Synthetic transform throughput only. Process RSS and CPU include Go test startup, not full database measurements. No linear speedup or privacy certification is claimed.' >> "$GITHUB_STEP_SUMMARY"

  phase3-stress:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Record stress environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase3-out
          { date --utc --iso-8601=seconds; go version; go env GOOS GOARCH; uname -a; nproc; git rev-parse HEAD; go list -m modernc.org/sqlite; } | tee phase3-out/ci-environment.txt
      - name: Randomized 10-repeat transaction comparison
        shell: bash
        run: |
          set -euo pipefail
          MASK_RIVER_PHASE3_DIR=phase3-out MASK_RIVER_PHASE3_REPS=10 go test -run '^TestPhase3BatchExperiment$' -count=1 -timeout 50m -v ./internal/runner
          MASK_RIVER_PHASE3_DIR=phase3-out go test -run '^TestPhase3ArtifactConsistency$' -count=1 -v ./internal/runner
      - name: Real SQLite 10k workers 1,2,4,8,16
        shell: bash
        run: |
          set -euo pipefail
          MASK_RIVER_PHASE3_10K_DIR=phase3-out go test -run '^TestPhase3Scale10K$' -count=1 -timeout 20m -v ./internal/runner
      - name: Compare SQLSpy observer overhead
        shell: bash
        run: |
          set -euo pipefail
          MASK_RIVER_PHASE3_OVERHEAD_DIR=phase3-out/observer-overhead go test -run '^TestPhase3ObserverOverhead$' -count=1 -timeout 30m -v ./internal/runner
          MASK_RIVER_PHASE3_OVERHEAD_DIR=phase3-out/observer-overhead go test -run '^TestPhase3ObserverOverheadArtifactConsistency$' -count=1 -v ./internal/runner
      - name: Correlate SQLite sync syscalls with Apply window
        shell: bash
        run: |
          set -euo pipefail
          MASK_RIVER_STRACE_APPLY=1 strace -f -ttt -T -yy -e trace=fsync,fdatasync,write -o phase3-out/fsync-trace.log go test -run '^TestPhase3StraceApply$' -count=1 -v ./internal/runner 2>&1 | tee phase3-out/fsync-test-output.txt
      - name: Upload phase-3 stress evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue13-phase3-stress
          path: phase3-out/
