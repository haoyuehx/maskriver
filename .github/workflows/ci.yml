name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unformatted = @(& gofmt -l $files)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Output
            throw 'Run gofmt on the listed files'
          }
      - name: Tests (MySQL explicitly skips without isolated harness)
        run: go test -count=1 -v ./...
      - name: Vet
        run: go vet ./...
      - name: Cross-build non-release targets
        if: runner.os == 'Linux'
        run: |
          GOOS=darwin  GOARCH=arm64 go build -o /tmp/maskriver-darwin-arm64 ./cmd/maskriver
          GOOS=darwin  GOARCH=amd64 go build -o /tmp/maskriver-darwin-amd64 ./cmd/maskriver
          GOOS=windows GOARCH=amd64 go build -o /tmp/maskriver-windows-amd64.exe ./cmd/maskriver
          GOOS=linux   GOARCH=arm64 go build -o /tmp/maskriver-linux-arm64 ./cmd/maskriver
          file /tmp/maskriver-darwin-arm64 /tmp/maskriver-darwin-amd64 /tmp/maskriver-windows-amd64.exe /tmp/maskriver-linux-arm64
      - name: Race
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  mysql-fixture:
    name: Isolated MySQL fixture, adapter and CLI acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Real MySQL fixture and adapter in disposable network-disabled container
        run: python3 scripts/test_mysql_container.py
      - name: Scope of evidence
        if: always()
        shell: bash
        run: |
          echo 'This job runs TestMySQLFixture, TestMySQLAdapter and TestMySQLCLIWorkflow against the same isolated MySQL 8.0.46 socket.' >> "$GITHUB_STEP_SUMMARY"
          echo 'TestMySQLCLIWorkflow is the real Scan->Preview->Approve->Apply->Validate CLI path on two disposable databases. MySQL recovery and versions other than 8.0.46 remain unverified.' >> "$GITHUB_STEP_SUMMARY"

  release-package:
    name: Deterministic release package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build twice, compare bytes and verify packaging
        run: scripts/test-release.sh
