name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unformatted = @(& gofmt -l $files)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) {
            $unformatted | Write-Output
            throw 'Run gofmt on the listed files'
          }
      - name: Tests (MySQL explicitly skips without isolated harness)
        run: go test -count=1 -v ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  mysql-fixture:
    name: Isolated MySQL fixture and adapter acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Real MySQL fixture and adapter in disposable network-disabled container
        run: python3 scripts/test_mysql_container.py
      - name: Scope of evidence
        if: always()
        shell: bash
        run: |
          echo 'This job runs TestMySQLFixture and TestMySQLAdapter against the same isolated MySQL 8.0.46 socket.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Successful tests verify the current MySQL adapter contract cases, not the full CLI workflow or untested MySQL versions.' >> "$GITHUB_STEP_SUMMARY"

  release-package:
    name: Deterministic release package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build twice, compare bytes and verify packaging
        run: scripts/test-release.sh
